<style>
/* ============================================================
   DESIGN TOKENS (spec 2.9)
   Every colour, size and spacing value on the page comes from here.
   A literal hex or px in a rule below is a bug waiting to happen —
   add a token instead.
   ============================================================ */
:root{
  /* Type — one system stack, one scale */
  --font:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --fs-xs:12px;   /* meta, secondary lines */
  --fs-sm:13px;   /* controls, body */
  --fs-md:15px;   /* card name, stat values */
  --fs-lg:17px;   /* detail name, hero numbers */
  --fs-xl:22px;   /* reserved: page-level figures */
  /* The one documented exception to the 12/13/15/17/22 scale: ALL-CAPS micro
     labels only. Uppercase reads about a step larger than its px suggests, so
     11px caps sit visually level with 12px sentence case. Never use it for
     sentence-case text. */
  --fs-label:11px;

  /* Colour — ONE accent for everything interactive */
  --accent:#0a6cff;
  --accent-strong:#0857cc;
  --accent-soft:#e8f0fe;
  --accent-ink:#0a4fbf;

  /* Grays */
  --text:#1d1d1f;
  --text-2:#6e6e73;
  --hairline:#e5e5ea;
  --bg:#f5f5f7;
  --surface:#fff;

  /* Type colours — markers, the 3px detail band and small type badges only.
     They never colour text, buttons or backgrounds. */
  --type-condo:var(--accent);
  --type-school:#1a3d7c;
  --type-commercial:#e8710a;
  /* 外食モード (D4). Inherited from 台帳v9 so a screenshot of the old ledger and
     this app read as the same thing. They live here, not in the JS, because
     nothing in this repo may write a literal hex outside :root.
     再訪意向 — the one place a colour carries meaning rather than type. */
  --rv-again:#1d5f55;   /* また行く */
  --rv-maybe:#c4901f;   /* 機会があれば */
  --rv-never:#a94a38;   /* もういい */
  --rv-none:#8a968f;    /* 未回答 */
  /* 台帳スコアの3本バー: 権威 / 継続性 / 評価 */
  --bar-au:#a94a38; --bar-ct:#123b35; --bar-ev:#c4901f;
  /* 訪問済みのカードが一覧で沈む度合い（v9 の .visited）。 */
  --visited-dim:.55;
  /* 飲食 — mirrored as MARKER_COLORS.dining in src/ui/map.js, because Leaflet
     builds marker HTML outside this stylesheet's cascade. Change both. */
  --type-dining:#c2185b;

  /* Spacing — 8px grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;

  /* Shape */
  --r-card:10px; --r-control:8px; --r-pill:999px;

  /* Motion — one duration, one curve. Nothing larger than a nudge. */
  --dur:150ms;
  --ease:cubic-bezier(0,0,.2,1);

  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 4px 16px rgba(0,0,0,.10);
  /* The one "you are here" ring: selected map marker, 40% accent (spec 2.7). */
  --ring-accent:0 0 0 2px var(--surface), 0 0 0 4.5px var(--accent);
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;height:100vh;font-size:var(--fs-sm);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}

/* ---- Shell ---- */
.header{background:var(--surface);padding:0 var(--s4);display:flex;align-items:center;border-bottom:1px solid var(--hairline);height:52px}
.header h1{font-size:var(--fs-lg);color:var(--text);font-weight:600;letter-spacing:-.2px;display:flex;align-items:baseline;gap:var(--s2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header h1 .en{font-size:var(--fs-xs);color:var(--text-2);font-weight:400;letter-spacing:0}
.main{display:flex;height:calc(100vh - 52px)}
#map{flex:1;min-width:0}
.panel{width:336px;background:var(--bg);border-left:1px solid var(--hairline);display:flex;flex-direction:column;overflow:hidden;transition:width var(--dur) var(--ease)}
/* 一覧は「決める面」なのに336px固定で、画面を広くしても地図だけが広がっていた
   （1500px幅で地図72%）。広い画面でだけ一覧にも分け前を渡す（2026-08-16）。 */
@media(min-width:1600px){.panel{width:400px}}
@media(min-width:1920px){.panel{width:460px}}
.panel.collapsed{width:0;border:none}
.toggle-panel{position:absolute;right:336px;top:57px;z-index:1000;background:var(--surface);border:1px solid var(--hairline);color:var(--accent);padding:6px var(--s2);cursor:pointer;border-radius:var(--r-control) 0 0 var(--r-control);font-size:var(--fs-sm);transition:right var(--dur) var(--ease);box-shadow:-2px 0 4px rgba(0,0,0,.06)}
.toggle-panel.collapsed{right:0}

/* ---- Summary tiles ---- */
.summary-bar{padding:var(--s1) var(--s2);background:var(--bg);border-bottom:1px solid var(--hairline);display:flex;gap:var(--s1);flex-shrink:0}
/* 値とラベルは縦に積む（2026-08-16 竹森氏指摘）。
   タイルは4分割で1枚77px。横に並べると値とラベルが同じ幅を取り合い、
   「RM 5,750」が61px使った結果ラベルには6pxしか残らず「家賃中央値」が
   「家」になっていた。縦なら両方が71pxをまるごと使える。 */
.summary-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px;background:var(--surface);border-radius:var(--r-control);border:1px solid var(--hairline)}
/* One line, always: a wrapped 「RM 30,000」 reads as two numbers. */
.summary-val{font-size:var(--fs-md);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.25}
.summary-label{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2}

/* 視覚的にだけ隠す(ラベルを支援技術と関連付けには残す) */
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.rec-badge{display:inline-flex;align-items:center;gap:2px;font-size:var(--fs-label);font-weight:600;color:var(--text-2);background:var(--bg);border-radius:var(--r-pill);padding:1px var(--s2);white-space:nowrap;line-height:1.5}
.rec-line{margin-bottom:var(--s2)}

/* ---- Controls ---- */
.filters{padding:var(--s2) var(--s2) var(--s1);background:var(--surface);border-bottom:1px solid var(--hairline);flex-shrink:1;overflow-y:auto}
.filter-row{display:flex;gap:var(--s2);margin-bottom:var(--s1)}
/* 4つ横並びだと1つ約90pxになり、選んだ値（「洋食・グリル」）が読めなくなる。
   飲食の行だけ2列で折り返す（2026-08-15 小分類セレクト追加にあわせて実測）。 */
.filter-row-2col{flex-wrap:wrap}
.filter-row-2col>.filter-group{flex:1 1 calc(50% - var(--s2));min-width:0}
.filter-group{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
/* .fg-label is the same caption for a group whose control is a button, not a
   form field: a <label> with nothing to point at is a dangling label. */
.filter-group label,.filter-group .fg-label{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;font-weight:600;letter-spacing:.2px}
/* Two toggles under one caption (外食モードの「自分の記録」). A second caption
   would be a <span> with nothing to say — the buttons name themselves. */
.fg-btns{display:flex;gap:var(--s2);flex-wrap:wrap}
.filter-group select,.filter-group input{background:var(--surface);border:1px solid var(--hairline);color:var(--text);padding:3px var(--s2);border-radius:var(--r-control);font-size:var(--fs-sm);min-width:0}
/* 小分類セレクトは大分類を選ぶまで押せない。.filter-group select が color を
   明示しているので、ブラウザ既定のグレーアウトは効かない — ここで名乗る。 */
.filter-group select:disabled{color:var(--text-2);background:var(--bg);cursor:not-allowed;opacity:1}
.filter-group select:focus,.filter-group input:focus,.sort-select:focus,.search-wrap input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(10,108,255,.16)}
.sort-row{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s1)}
.sort-label{font-size:var(--fs-xs);color:var(--text-2);font-weight:600;white-space:nowrap}
.sort-select{flex:1;min-width:0;background:var(--surface);border:1px solid var(--hairline);color:var(--text);padding:3px var(--s2);border-radius:var(--r-control);font-size:var(--fs-sm)}
.sort-btn{background:var(--surface);border:1px solid var(--hairline);color:var(--text-2);padding:5px var(--s3);border-radius:var(--r-pill);font-size:var(--fs-xs);cursor:pointer;font-weight:600;transition:all var(--dur) var(--ease);white-space:nowrap}
.sort-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.sort-btn.active{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* ---- Layer segmented control (spec 2.2) ---- */
.layer-seg{display:flex;background:var(--bg);border-radius:var(--r-control);padding:2px;margin-bottom:var(--s1)}
/* 層チップ = ☑(表示) + 名前(一覧の切替)。アクティブ層は名前が濃く下線 */
.layer-chip{display:flex;flex:1;align-items:stretch;border-radius:var(--r-control);overflow:hidden}
/* 本物のチェックボックスに見えること（「どこで使えるのか分からない」への回答）:
   未チェック=空の四角、チェック=アクセント塗り+白✓。 */
.chip-vis{width:16px;height:16px;align-self:center;margin-left:var(--s2);flex:none;border:1.5px solid var(--text-2);border-radius:4px;background:var(--surface);color:transparent;font-size:var(--fs-label);font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.chip-vis[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-vis:hover{border-color:var(--accent)}
.chip-name{flex:1;border:none;background:transparent;cursor:pointer;padding:6px var(--s1);font-size:var(--fs-xs);font-weight:600;color:var(--text-2);border-radius:var(--r-control);white-space:nowrap}
.chip-name:hover{color:var(--text)}
.layer-chip.active{background:var(--surface);box-shadow:var(--shadow-1)}
.layer-chip.active .chip-name{color:var(--accent)}

/* ---- Search with clear ---- */
.search-wrap{position:relative;display:flex}
.search-wrap input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--hairline);color:var(--text);padding:6px 30px 6px var(--s2);border-radius:var(--r-control);font-size:var(--fs-sm)}
.search-clear{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-2);font-size:var(--fs-xs);cursor:pointer;padding:var(--s2);line-height:1}
.search-clear:hover{color:var(--text)}
.search-wrap:has(input:placeholder-shown) .search-clear{visibility:hidden}
/* チップ✕の40px当たり判定はデスクトップにも効かせる（見た目は不変） */
.fchip{position:relative}
.fchip-x::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px}

/* ---- Progressive disclosure ---- */
.disclosure{background:var(--bg);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:2px var(--s3);color:var(--accent);font-size:var(--fs-xs);font-weight:600;cursor:pointer;padding:var(--s1) 0;margin-top:2px}
.disclosure{padding:2px 0;margin-top:0}
.disclosure:hover{text-decoration:underline}
.chip-toggle{background:var(--surface);border:1px solid var(--hairline);color:var(--text-2);border-radius:var(--r-pill);padding:5px var(--s3);font-size:var(--fs-xs);font-weight:600;cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap}
.chip-toggle:hover{border-color:var(--accent);color:var(--accent)}
.chip-toggle.active{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* ---- Active filter chips (spec 2.3) ---- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
.fchip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-pill);padding:2px var(--s1) 2px var(--s2);font-size:var(--fs-xs);font-weight:600;max-width:100%;animation:chipIn var(--dur) var(--ease)}
.fchip-x{background:none;border:none;color:var(--accent-ink);font-size:var(--fs-label);cursor:pointer;padding:2px var(--s1);line-height:1;border-radius:50%}
.fchip-x:hover{background:rgba(10,79,191,.15)}
.fchip-clear{background:none;border:none;color:var(--text-2);font-size:var(--fs-xs);font-weight:600;cursor:pointer;padding:2px var(--s2);text-decoration:underline}
.fchip-clear:hover{color:var(--accent)}
@keyframes chipIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ---- List ---- */
.condo-list{flex:1;overflow-y:auto;padding:var(--s2)}
.condo-list::-webkit-scrollbar{width:6px}
.condo-list::-webkit-scrollbar-thumb{background:#d0d0d6;border-radius:3px}
.condo-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s3);margin-bottom:var(--s2);cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);box-shadow:var(--shadow-1)}
.condo-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.condo-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow-2)}

/* ---- Cards (spec 2.5: one template per type) ---- */
.card-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:1px}
.card-name{font-size:var(--fs-md);font-weight:600;color:var(--text);line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
/* School names have no short form that still names the campus: wrap to a
   second line rather than cut it off. Capped at two so cards stay uniform. */
.card-name-wrap{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-ja{font-size:var(--fs-xs);color:var(--text-2);margin-bottom:var(--s1)}
.card-hero{font-size:var(--fs-md);font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.3px;margin:2px 0}
.card-hero-muted{color:var(--text-2);font-weight:500}
.card-addr{font-size:var(--fs-xs);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:var(--fs-xs);color:var(--text-2);font-variant-numeric:tabular-nums;margin-top:2px}
.card-score{font-size:var(--fs-label);color:var(--text-2);margin-top:var(--s1);font-variant-numeric:tabular-nums}
.card-award{font-size:var(--fs-xs);line-height:1}
.card-chip{margin-left:auto;font-size:var(--fs-label);padding:1px var(--s2);border-radius:var(--r-pill);font-weight:600;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
/* School cards give the name the whole line and drop the chip underneath, so a
   long school name is not cut to 55% of the card. */
.chip-area-mark{background:var(--accent-soft);color:var(--accent);font-weight:700}
.card-chips{margin:2px 0 var(--s1);display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center}
.card-chips .card-chip{display:inline-block;margin-left:0;margin-right:var(--s1);max-width:100%}
.chip-school{background:var(--accent-soft);color:var(--type-school)}
/* 飲食: the michelin standing is the stronger signal, so it is the filled chip
   and the category is the quiet outline next to it. */
.chip-michelin{background:var(--type-dining);color:var(--surface)}
.chip-dining{background:var(--bg);color:var(--text-2);border:1px solid var(--hairline)}
.type-badge{display:inline-block;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:var(--fs-label);flex-shrink:0}
.type-school{background:var(--type-school)}
.type-commercial{background:var(--type-commercial);border-radius:5px}
/* The card badge repeats the map pin's teardrop, so the two read as one thing. */
.type-dining{background:var(--type-dining);border-radius:50% 50% 50% 2px}
.tier-badge{display:inline-block;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:var(--fs-label);font-weight:800;color:var(--surface);flex-shrink:0}

/* ---- Loading skeleton (spec 2.10 / audit E3) ---- */
.skel-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s3);margin-bottom:var(--s2)}
.skel-line{height:10px;border-radius:5px;background:linear-gradient(90deg,#eaeaef 25%,#f4f4f7 37%,#eaeaef 63%);background-size:400% 100%;animation:skel 1.4s ease-in-out infinite}
.skel-line+.skel-line{margin-top:var(--s2)}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---- Empty state (spec 2.3) ---- */
.empty-state{padding:var(--s5) var(--s4);text-align:center}
.empty-title{font-size:var(--fs-md);font-weight:600;color:var(--text);margin-bottom:var(--s3)}
.empty-sub{font-size:var(--fs-xs);color:var(--text-2);margin-bottom:var(--s2)}
.empty-chips{display:flex;flex-wrap:wrap;gap:var(--s1);justify-content:center;margin-bottom:var(--s4)}
.empty-none{font-size:var(--fs-xs);color:var(--text-2)}
.btn-clear-all{background:var(--accent);color:var(--surface);border:none;border-radius:var(--r-control);padding:var(--s2) var(--s5);font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:background var(--dur) var(--ease)}
.btn-clear-all:hover{background:var(--accent-strong)}

/* ---- Panel footer: where the numbers come from (spec 2.1) ---- */
.panel-footer{padding:2px var(--s3);font-size:var(--fs-label);color:var(--text-2);border-top:1px solid var(--hairline);background:var(--bg);line-height:1.35;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   DETAIL OVERLAY (spec 2.6)
   ============================================================ */
.info-overlay{position:absolute;top:48px;left:0;bottom:0;z-index:1001;background:var(--surface);border-radius:0 0 var(--r-card) 0;box-shadow:var(--shadow-2);width:300px;max-height:100%;overflow-y:auto;display:none}
.info-overlay.active{display:block;animation:infoIn var(--dur) var(--ease)}
@keyframes infoIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
/* 3px band in the record's type colour — the only place type colour appears in the panel. */
.info-band{height:3px}
/* The header stays put while the body scrolls, so the ✕ is always reachable —
   on a long school entry it used to scroll out of the overlay entirely. */
.info-sticky{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--hairline)}
.info-close{position:absolute;top:var(--s1);right:var(--s1);width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;font-size:var(--fs-md);cursor:pointer;color:var(--text-2);line-height:1;border-radius:50%;z-index:2;transition:background var(--dur) var(--ease)}
.info-close:hover{background:var(--bg);color:var(--text)}
.info-head{padding:var(--s3) var(--s3) var(--s2)}
.info-name{font-size:var(--fs-lg);font-weight:600;color:var(--text);line-height:1.3;letter-spacing:-.3px;padding-right:36px}
.info-ja{font-size:var(--fs-xs);color:var(--text-2);margin-top:2px}
.info-addr{font-size:var(--fs-xs);color:var(--text-2);margin-top:var(--s1)}
.info-tagline{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:var(--fs-xs);color:var(--text-2);flex-wrap:wrap}
/* 詳細 / 周辺 tabs */
.info-tabs{display:flex;gap:2px;margin:0 var(--s3);border-bottom:1px solid var(--hairline)}
.info-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:var(--s2) var(--s1);font-size:var(--fs-sm);font-weight:600;color:var(--text-2);cursor:pointer;transition:color var(--dur) var(--ease)}
.info-tab:hover{color:var(--accent)}
.info-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.info-tab-body{padding:var(--s3)}
/* Key stats: label / value pairs on a 2-column grid */
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s2)}
/* The key labels are Japanese now, so the caps transform is gone: it did
   nothing to 日本語 and only stretched the few latin words (LUXURY) that still
   have to fit a 134px column beside their source term. */
.kv-label{font-size:var(--fs-label);color:var(--text-2);letter-spacing:.3px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The source's own English term (PSF / NLA), kept beside the Japanese so a
   listing on iProperty or EdgeProp can still be matched. Subordinate by weight
   and tone, not by size — 11px is the bottom of the scale. */
.kv-sub{font-size:var(--fs-label);font-weight:400;letter-spacing:0;opacity:.75}
.kv-val{font-size:var(--fs-md);color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px;line-height:1.3;margin-top:1px}
.kv-link{color:var(--accent);text-decoration:none}
.kv-link:hover{text-decoration:underline}
.kv-val.muted{color:var(--text-2);font-weight:500}
/* Any further block of information: a hairline, a caps title, then the content. */
.info-sec{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--hairline)}
.info-sec-title{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.3px;color:var(--text-2);font-weight:700;margin-bottom:var(--s2);display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
/* A second fact about the block (a score, a count) at the right of its title —
   never smuggled into the title text, where a number reads as a count of what
   is listed below it. */
.info-sec-meta{font-weight:600;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.9}
/* A folded block replaces the title with its own summary, so it does not add a
   second gap on top of the section's. */
.info-sec>.data-details{margin-top:0}
.info-sec-body{font-size:var(--fs-xs);color:var(--text);line-height:1.6}
.info-fees{width:100%;font-size:var(--fs-xs);border-collapse:collapse;font-variant-numeric:tabular-nums}
.info-fees td{padding:var(--s1) 0;border-bottom:1px solid var(--hairline)}
.info-fees td:first-child{color:var(--text-2)}
.info-fees td:last-child{text-align:right;font-weight:600;color:var(--text)}
.info-fees tr:last-child td{border-bottom:none}
.info-note{font-size:var(--fs-label);color:var(--text-2);margin-top:var(--s2);line-height:1.5}
/* Each facility wraps as a unit — Japanese breaks between any two characters,
   so a run of space-separated text split 「1フロア3戸以下」 across two lines. */
.info-feature-list{font-size:var(--fs-xs);color:var(--text);line-height:1.6;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3)}
.info-feature-list>span{white-space:nowrap}
/* External links: one accent, text buttons, no filled colour blocks (audit C4) */
.info-links{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--hairline)}
.info-link{font-size:var(--fs-sm);color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.info-link:hover{text-decoration:underline}

/* 周辺 tab */
.nb-bucket{margin-bottom:var(--s4)}
.nb-head{font-size:var(--fs-sm);font-weight:700;color:var(--text);margin-bottom:1px}
.nb-counts{font-size:var(--fs-label);color:var(--text-2);margin-bottom:var(--s1)}
.nb-row{display:flex;align-items:center;gap:var(--s2);padding:6px 2px;border-bottom:1px solid var(--hairline);cursor:pointer;font-size:var(--fs-xs);transition:background var(--dur) var(--ease)}
.nb-row:hover{background:var(--accent-soft)}
.nb-icon{width:16px;text-align:center;flex-shrink:0}
.nb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-dist{color:var(--text-2);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.nb-empty{font-size:var(--fs-xs);color:var(--text-2);padding:var(--s3) 2px;text-align:center}

/* ---- Map furniture ---- */
/* The bar floats over the MAP only: its max-width stops 352px short of the
   right edge (336px list panel + its fold button), because before this it
   spanned .main's full width and buried the panel's summary tiles
   (TOTAL / SHOWN) under itself. When the panel is folded away it reclaims
   that width. 50px on the left keeps it clear of the zoom control. */
.area-jump{position:absolute;top:var(--s2);left:50px;z-index:1000;display:flex;align-items:center;gap:var(--s1);background:rgba(255,255,255,.96);padding:5px var(--s2);border-radius:var(--r-pill);box-shadow:var(--shadow-2);border:1px solid var(--hairline);max-width:calc(100% - 402px);overflow-x:auto;white-space:nowrap;scrollbar-width:none;mask-image:linear-gradient(to right,#000 92%,transparent)}
.main:has(#panel.collapsed) .area-jump{max-width:calc(100% - 120px)}
.area-jump::-webkit-scrollbar{display:none}
.area-jump button{background:var(--bg);border:1px solid var(--hairline);color:var(--text);padding:3px var(--s3);border-radius:var(--r-pill);font-size:var(--fs-xs);cursor:pointer;font-weight:600;white-space:nowrap;transition:all var(--dur) var(--ease)}
.area-jump button:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.area-jump button.active{background:var(--accent);color:var(--surface);border-color:var(--accent)}
/* ペナンは既定で畳む: トグルだけ見え、開くと中のエリアボタンが並ぶ。
   display:contents なので開いた中身はバーの flex に直接参加する。 */
.penang-areas{display:none}
.penang-areas.open{display:contents}
.aj-penang-toggle{font-weight:700}
.aj-penang-toggle[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.aj-label{font-size:var(--fs-label);color:var(--text-2);font-weight:700;padding:0 2px}
.aj-div{color:var(--hairline);padding:0 2px}
/* ---- Selected marker (spec 2.7 / audit D3) ----
   Leaflet owns the icon element's own transform (that is how it positions the
   marker), so the ring and the scale go on the pin INSIDE it. The pin's
   box-shadow is written inline by map.js, hence the !important — it is the one
   place the stylesheet has to win over generated markup. */
.mk-pin>div{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),filter var(--dur) var(--ease)}
/* 背景層の減光: 不透明度でなく彩度を落とす（高彩度オレンジは45%でも主役より目立ってしまうため） */
/* ホバー=「押せる」の予告。選択リングとは別物なので控えめに */
.mk-pin:hover>div{transform:scale(1.12);box-shadow:var(--shadow-2)}
.mk-pin.mk-pin-sel:hover>div{transform:scale(1.45)}
.mk-pin-sel{z-index:1000!important}
.mk-pin-sel>div{transform:scale(1.45);box-shadow:var(--ring-accent)!important}
/* 選択中ピンの波紋(2026-08-08: どの店を選んだか地図上で指させる) */
.mk-pin-sel>div::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--accent);animation:selpulse 1.6s ease-out infinite;pointer-events:none}
@keyframes selpulse{0%{transform:scale(.65);opacity:.9}70%{transform:scale(1.2);opacity:0}100%{transform:scale(1.2);opacity:0}}
/* 同一住所ピンの選び直しポップアップ(2026-08-09) */
.colo-list{display:flex;flex-direction:column;gap:var(--s1);min-width:180px}
.colo-item{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:6px var(--s2);font-size:var(--fs-label);text-align:left;cursor:pointer;color:var(--text-1)}
.colo-item:hover{border-color:var(--accent);color:var(--accent)}
.colo-item.on{border-color:var(--accent);background:var(--accent-soft)}

.map-legend{position:absolute;bottom:var(--s5);left:var(--s4);z-index:1000;background:var(--surface);padding:var(--s3) var(--s4);border-radius:var(--r-card);box-shadow:var(--shadow-2);border:1px solid var(--hairline)}
.map-legend-title{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:var(--s2)}
.map-legend-item{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-xs);color:var(--text-2);margin:var(--s1) 0}
.map-legend-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);box-shadow:var(--shadow-1)}
.map-legend-section{margin-top:var(--s3);padding-top:var(--s2);border-top:1px solid var(--hairline)}

/* ---- School Finder (reworked in B3c; tokenised here) ---- */
.school-finder{flex:1;overflow:hidden;display:flex;flex-direction:column}
.sf-header{padding:var(--s2) var(--s3);background:var(--surface);border-bottom:1px solid var(--hairline);flex-shrink:0}
.sf-title{font-size:var(--fs-sm);font-weight:700;color:var(--text);margin-bottom:var(--s2)}
.sf-back{background:none;border:1px solid var(--hairline);color:var(--accent);border-radius:var(--r-control);padding:var(--s1) var(--s3);font-size:var(--fs-xs);font-weight:600;cursor:pointer}
.sf-back:hover{background:var(--accent-soft)}
.sf-age-row{display:flex;align-items:center;gap:var(--s2)}
.sf-age-row label{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;font-weight:600;white-space:nowrap}
.sf-age-row select{flex:1;min-width:0;padding:5px var(--s2);border:1px solid var(--hairline);border-radius:var(--r-control);font-size:var(--fs-sm);background:var(--surface);color:var(--text)}
.sf-count{font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap}
.sf-body{flex:1;overflow-y:auto;padding:var(--s2)}
.sf-row{padding:var(--s2) var(--s1);border-bottom:1px solid var(--hairline);cursor:pointer;transition:background var(--dur) var(--ease)}
.sf-row:hover{background:var(--accent-soft)}
.sf-row.sf-selected{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sf-row-top{display:flex;align-items:baseline;gap:var(--s2)}
/* KL / ペナン — the only thing that tells two same-named campuses apart. */
.sf-area{font-size:var(--fs-label);font-weight:700;color:var(--text-2);background:var(--bg);border-radius:var(--r-pill);padding:1px var(--s2);white-space:nowrap;flex-shrink:0}
.sf-name{font-size:var(--fs-xs);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-fee{font-size:var(--fs-sm);font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.sf-per{font-size:var(--fs-label);font-weight:600;color:var(--text-2)}
/* Which published year the number came from. Grayed, because it qualifies the
   figure above rather than competing with it. */
.sf-grade{font-size:var(--fs-label);color:var(--text-2);margin-top:1px}
.sf-grade-near{color:var(--type-commercial)}
.sf-nodata{font-size:var(--fs-label);color:var(--text-2);padding:var(--s2) var(--s1)}
.sf-chart-wrap{margin-top:var(--s3);padding:var(--s2);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card)}
.sf-chart-title{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:var(--s1)}
.sf-legend{text-align:center;line-height:2;margin-top:2px}
.sf-legend span{display:inline-flex;align-items:center;gap:2px;margin:0 3px;font-size:var(--fs-label);font-weight:600}
.sf-condo-section{margin-top:var(--s3);padding:var(--s2) var(--s3);background:var(--surface);border-radius:var(--r-card);border:1px solid var(--hairline)}
.sf-condo-title{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:var(--s2)}
.sf-condo-row{padding:var(--s1) 0;border-bottom:1px solid var(--hairline);font-size:var(--fs-xs);cursor:pointer;display:flex;justify-content:space-between;gap:var(--s2)}
.sf-condo-row:hover{color:var(--accent)}
.sf-condo-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-condo-dist{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
/* Distance bands, same wording as the detail panel's 周辺 tab. */
.sf-bucket-head{display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--fs-label);font-weight:700;color:var(--text);margin-top:var(--s2)}
.sf-bucket-n{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
.sf-condo-more{font-size:var(--fs-label);color:var(--text-2);padding:var(--s1) 0}
.sf-empty{font-size:var(--fs-xs);color:var(--text-2)}

/* ---- Data load warning ---- */
.load-warn{margin:var(--s2);padding:var(--s3);background:#fdecea;border:1px solid #d93025;border-radius:var(--r-control);color:#b3261e;font-size:var(--fs-xs);line-height:1.6}
.load-error{padding:var(--s5) var(--s4);text-align:center;color:#b3261e;font-size:var(--fs-sm)}

/* ============================================================
   外食モード (D4) — the private half of the app
   Nothing in this block is reachable in 住まいモード: the markup that carries
   these classes is only generated when appMode === 'eatout' (src/ui/dining.js).
   ============================================================ */
/* ---- Mode switch, in the header ---- */
/* 保存の状況が右に並ぶので、右端へ押し出すのは mode-seg ではなく h1 側の役目に
   なった（h1 が伸び、切り替えと保存はその右に固まって並ぶ）。
   min-width を置くのは、置かないとスマホで h1 が幅0まで潰れてアプリ名が
   消えたため（実測 2026-08-16）。 */
.header h1{flex:1 1 auto;min-width:96px}
.mode-seg{display:flex;background:var(--bg);border-radius:var(--r-pill);padding:2px;flex-shrink:0}
.mode-btn{background:transparent;border:none;color:var(--text-2);font-size:var(--fs-xs);font-weight:600;padding:6px var(--s3);border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:all var(--dur) var(--ease)}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}

/* ---- The card splits in two: an openable half and the record controls ---- */
.record-card{padding:0}
.card-main{padding:var(--s2) var(--s3);cursor:pointer;border-radius:var(--r-card) var(--r-card) 0 0}
/* 訪問済みは一覧で沈む。沈むのは「店の説明」だけで、下の記録欄は編集するための
   ものなので薄くしない。 */
.record-card.visited .card-main{opacity:var(--visited-dim)}
.record-card.visited:hover .card-main,.record-card.visited:focus-within .card-main{opacity:1}

/* ---- 台帳スコア ---- */
/* 一覧カードでは1行ミニ表示(2026-08-08 密度改善)。内訳バーの意味は詳細パネルが正 */
.record-card .scorebox{margin-bottom:var(--s1);padding-bottom:var(--s1);gap:var(--s2)}
.record-card .sc-num{font-size:var(--fs-lg)}
.record-card .sc-break{display:none}
.record-card .sc-bars{flex-direction:row;gap:var(--s1)}
.record-card .sc-bar{flex:1}
.record-card .sc-bar-label{display:none}
.scorebox{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--hairline)}
.sc-total{display:flex;align-items:baseline;gap:2px;flex-shrink:0}
.sc-num{font-size:var(--fs-xl);font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.sc-unit{font-size:var(--fs-label);color:var(--text-2)}
.sc-break{font-size:var(--fs-label);color:var(--text-2);font-variant-numeric:tabular-nums;flex-shrink:0}
.sc-bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-bar{display:flex;align-items:center;gap:var(--s1)}
.sc-bar-label{font-size:var(--fs-label);color:var(--text-2);width:3.4em;flex-shrink:0}
.sc-bar-track{flex:1;min-width:0;height:4px;background:var(--hairline);border-radius:2px;overflow:hidden}
.sc-bar-fill{display:block;height:100%;border-radius:2px}
.sc-au{background:var(--bar-au)}.sc-ct{background:var(--bar-ct)}.sc-ev{background:var(--bar-ev)}
.sc-rating{font-size:var(--fs-xs);color:var(--text-2);font-variant-numeric:tabular-nums;padding:0 var(--s3) var(--s2)}

/* ---- 記録欄 (visitbox) ---- */
.visitbox{padding:var(--s2) var(--s3) var(--s3);border-top:1px solid var(--hairline);background:var(--bg);border-radius:0 0 var(--r-card) var(--r-card)}
.vb-head{display:flex;gap:var(--s2);flex-wrap:wrap}
/* 評価と記録ボタンが1行を分け合う。ボタン側が固定幅なので、評価は残りに
   押し込まれて数件が1〜2文字だけ欠けていた（2026-08-16 実測: 必要120px/実119px）。
   左右の余白を詰めて評価に返す。 */
.vb-line{display:flex;align-items:center;gap:var(--s1);padding:0 var(--s2) var(--s2)}
.vb-line .sc-rating{padding:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-mini{display:flex;gap:var(--s1);flex-shrink:0}
.vb-mini .vb-toggle{flex:none;padding:3px var(--s2);font-size:var(--fs-label)}
.vb-hide{flex:none!important;opacity:.55;padding-left:var(--s1)!important;padding-right:var(--s1)!important}
.vb-hide:hover{opacity:1;color:var(--rv-never);border-color:var(--rv-never)}
.vb-toggle{flex:1;min-width:0;background:var(--surface);border:1px solid var(--hairline);color:var(--text-2);border-radius:var(--r-pill);padding:4px var(--s2);font-size:var(--fs-xs);font-weight:600;cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap}
.vb-toggle:hover{border-color:var(--accent);color:var(--accent)}
.vb-visit.on{background:var(--rv-again);border-color:var(--rv-again);color:var(--surface)}
.vb-want.on{background:var(--accent);border-color:var(--rv-maybe);color:var(--surface)}
.vb-date{font-size:var(--fs-label);color:var(--text-2);font-variant-numeric:tabular-nums;margin-top:var(--s2);display:flex;align-items:center;gap:var(--s2)}
/* 訪問日は直せる(2026-08-16)。日付入力は他の入力欄と同じ見た目に揃える。 */
.vb-vd{font-family:inherit;font-size:var(--fs-xs);color:var(--text);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-control);padding:2px var(--s2);font-variant-numeric:tabular-nums}
/* クラウド保存のログイン欄（2026-08-16）。データ管理画面の中だけで使う。 */
.cloud-form{display:flex;flex-direction:column;gap:2px;margin:var(--s2) 0}
.cloud-form .vb-flabel{margin-top:var(--s1)}
.cloud-form input{max-width:280px}
.vb-vd:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(10,108,255,.16)}
.vb-q{font-size:var(--fs-xs);color:var(--text);font-weight:600;margin-top:var(--s2)}
.vb-hint{font-size:var(--fs-label);color:var(--text-2);font-weight:400}
.vb-rv{display:flex;gap:var(--s1);margin-top:var(--s1)}
.vb-rv-btn{flex:1;min-width:0;background:var(--surface);border:1px solid var(--hairline);color:var(--text-2);border-radius:var(--r-control);padding:6px 2px;font-size:var(--fs-label);font-weight:600;cursor:pointer;transition:all var(--dur) var(--ease)}
.vb-rv-btn.rv-a.on{background:var(--rv-again);border-color:var(--rv-again);color:var(--surface)}
.vb-rv-btn.rv-m.on{background:var(--rv-maybe);border-color:var(--rv-maybe);color:var(--surface)}
.vb-rv-btn.rv-n.on{background:var(--rv-never);border-color:var(--rv-never);color:var(--surface)}
.vb-field{display:flex;flex-direction:column;gap:2px;margin-top:var(--s2)}
.vb-flabel{font-size:var(--fs-label);color:var(--text-2);text-transform:uppercase;font-weight:600;letter-spacing:.2px}
.vb-amt,.vb-memo{background:var(--surface);border:1px solid var(--hairline);color:var(--text);border-radius:var(--r-control);padding:6px var(--s2);font-size:var(--fs-sm);font-family:var(--font);width:100%}
.vb-amt{font-variant-numeric:tabular-nums}
.vb-memo{resize:vertical;line-height:1.5}
.vb-amt:focus,.vb-memo:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(10,108,255,.16)}
.vb-privacy{font-size:var(--fs-label);color:var(--text-2);margin-top:var(--s2);line-height:1.5}

/* ---- データ ---- */
.dataview{padding-bottom:var(--s4)}
.data-sec{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s3);margin-bottom:var(--s2)}
.data-h{font-size:var(--fs-sm);font-weight:700;color:var(--text);margin-bottom:var(--s2)}
.data-line{font-size:var(--fs-xs);color:var(--text);font-variant-numeric:tabular-nums;margin-bottom:2px}
.data-note{font-size:var(--fs-label);color:var(--text-2);line-height:1.6;margin:var(--s1) 0 var(--s2)}
.data-warn{font-size:var(--fs-xs);color:var(--rv-never);border:1px solid var(--rv-never);border-radius:var(--r-control);padding:var(--s2);margin-bottom:var(--s2);line-height:1.5}
.data-btns{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s2) 0}
.data-btn{background:var(--surface);border:1px solid var(--hairline);color:var(--text);border-radius:var(--r-control);padding:var(--s2) var(--s3);font-size:var(--fs-xs);font-weight:600;cursor:pointer;transition:all var(--dur) var(--ease)}
.data-btn:hover{border-color:var(--accent);color:var(--accent)}
.data-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.data-btn.danger{color:var(--rv-never);border-color:var(--rv-never)}
.data-btn.danger:hover{background:var(--rv-never);color:var(--surface)}
.data-area{width:100%;background:var(--bg);border:1px solid var(--hairline);color:var(--text);border-radius:var(--r-control);padding:var(--s2);font-size:var(--fs-xs);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.data-result{font-size:var(--fs-xs);color:var(--text);line-height:1.5;margin-top:var(--s1)}
.data-result.bad{color:var(--rv-never)}

/* ---- 保存バー / toast ---- */
/* 一覧の下の帯から、ヘッダーの 住まい/外食 の右へ移した(2026-08-16 竹森氏指示)。
   ヘッダーは畳まれないので、スマホでも常に「誰として、どこまで保存されたか」が
   見える。高さ52px(スマホ44px)の中に収める必要があるので1行で切る。 */
.savebar{display:flex;align-items:center;gap:var(--s2);margin-left:var(--s3);min-width:0;flex:0 1 auto;
  font-size:var(--fs-label);color:var(--text-2)}
/* 前半(誰として保存しているか)は縮めない。切り詰まるのは後半(いつ)だけ。 */
.savebar-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-head{white-space:nowrap}
.savebar-link{flex-shrink:0;background:transparent;border:1px solid var(--hairline);color:var(--accent);border-radius:var(--r-pill);padding:1px var(--s2);font-size:var(--fs-label);font-weight:600;cursor:pointer}
.savebar.bad{color:var(--surface);background:var(--rv-never);border-radius:var(--r-control);padding:0 var(--s2)}
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--surface);font-size:var(--fs-xs);padding:var(--s2) var(--s4);border-radius:var(--r-pill);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;z-index:2000;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   KEYBOARD FOCUS (B4 a11y)
   Everything you can operate has to say so when you reach it with Tab. This
   block sits last on purpose: the :focus rules further up kill the outline in
   favour of a soft ring, and a mouse click should not draw a focus box — but a
   keyboard landing always must. :focus-visible is the browser's own answer to
   "was this reached by keyboard", so the same declarations win here by order.
   ============================================================ */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filter-group select:focus-visible,.filter-group input:focus-visible,
.sort-select:focus-visible,.search-wrap input:focus-visible,
.sf-age-row select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Rows and cards are flush with their container, so the ring goes inside. */
.condo-card:focus-visible,.nb-row:focus-visible,.sf-row:focus-visible,
.sf-condo-row:focus-visible,.card-main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* The markers are Leaflet's elements; the ring goes on the pin inside, the same
   place the selected-marker ring lives (see .mk-pin-sel above). */
.mk-pin:focus-visible{outline:none}
.mk-pin:focus-visible>div{outline:2px solid var(--accent);outline-offset:2px}

/* ---- Respect the OS "reduce motion" setting ---- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ============================================================
   MOBILE (≤768px)  — B4
   Not a second design, the same one re-proportioned. Three rules govern it:
   1. The bottom panel is 55% of the split (it was 27vh, which cut the richer
      B3 cards in half — you could not read one card without scrolling; 45%
      still did not fit one whole card and was raised again on 2026-08-16).
   2. The split is a share of .main, not of the viewport. 73vh+27vh added up to
      a full screen inside a container that is a screen MINUS the header, so
      the bottom of the panel was clipped by exactly the header's height.
   3. Anything you tap is at least 40px in its smallest dimension.
   ============================================================ */
.data-details{margin-top:var(--s1)}
.data-details>summary{font-size:var(--fs-xs);font-weight:600;color:var(--accent);cursor:pointer;padding:var(--s1) 0}
.data-details[open]>summary{margin-bottom:var(--s1)}

/* ホバー情報カード: マーカーを指すだけで要点が出る（PC前提・2026-08-07裁定）。
   地図を妨げない幅に留め、ポインタは奪わない（外すと即消える） */
.map-hover-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-2);padding:var(--s2) var(--s3);width:max-content;max-width:250px;pointer-events:none;white-space:normal}
.map-hover-card:before{border-top-color:var(--surface)}
.mhc-name{font-size:var(--fs-sm);font-weight:700;color:var(--text);line-height:1.25}
.mhc-ja{font-size:var(--fs-label);color:var(--text-2)}
.mhc-hero{font-size:var(--fs-sm);font-weight:600;color:var(--text);margin-top:2px}
.mhc-sub{font-size:var(--fs-label);color:var(--text-2);margin-top:1px}

/* 押下感: タッチにはhoverが無いので、押した瞬間の反応をここで一括付与 */
.condo-card:active,.mode-btn:active,.chip-toggle:active,.vb-toggle:active,.vb-rv-btn:active,.data-btn:active,.area-jump button:active,.nb-row:active,.sf-row:active,.sort-btn:active,.aj-penang-toggle:active{transform:scale(.98);opacity:.85}
/* 商業施設と飲食店の重なり（2026-08-16 竹森氏指摘）。
   モールの中や真上にある店は座標がほぼ同じで、飲食の雫が商業の四角を覆っていた。
   商業は zIndexOffset で常に上に描き、そこに乗る飲食はアイコンだけ右へずらす。
   ずらすのは見た目だけで、マーカーの緯度経度は本物のまま（選ぶと正しい位置へ寄る）。
   十分に寄ったズーム（18以上）では地図上で自然に離れるので、ずらしを打ち消す。 */
.mk-mall-shift{transform:translateX(32px)}
.leaflet-container.mk-mall-apart .mk-mall-shift{transform:none}

/* 記録カード: 押せるのは .card-main だけ。それ以外にポインタと持ち上げを出さない */
.record-card{cursor:default}
.record-card:hover{transform:none;box-shadow:var(--shadow-1)}

@media(max-width:768px){
  body{height:100dvh}
  /* 端の余白を1段詰めるのは、ヘッダーに保存の状況が入って実測362pxが満杯に
     なったため（ユーザー名102px に対し94pxしか空かなかった・2026-08-16）。 */
  .header{padding:0 var(--s2);height:44px}
  .header h1{font-size:var(--fs-md)}
  .header h1 .en{display:none}
  .main{flex-direction:column;height:calc(100vh - 44px);height:calc(100dvh - 44px)}
  #map{flex:1 1 auto;height:auto;min-height:0}
  /* 45% は 2026-08-07 に一度直した値だが、実測すると一覧に残るのは 126px で、
     カード1枚(220px)が丸ごと入らなかった（サマリー35 + 絞り込み101 + 保存バー35
     + 出典24 が上下を食う）＝「カードを半分に切らない」という当時の意図をまだ
     満たせていなかった。55% にすると一覧197px＝1枚が丸ごと出る。地図は321pxで、
     周辺が読める大きさは保っている（2026-08-16 実測）。 */
  .panel{width:100%!important;flex:0 0 55%;height:auto;border-left:none;border-top:1px solid var(--hairline)}
  .panel.collapsed{flex:0 0 0;height:0;min-height:0}
  .toggle-panel{right:var(--s3)!important;top:auto;bottom:55%;border-radius:var(--r-control) var(--r-control) 0 0;padding:var(--s2) var(--s4);z-index:1001;font-size:var(--fs-xs);min-height:40px}
  .toggle-panel.collapsed{bottom:0}
  .summary-bar{gap:3px;padding:var(--s1)}
  /* 縦積みにした分（2026-08-16）、狭い画面では行間と余白を詰めて取り返す。
     一覧はカード1枚がちょうど収まる高さしかないので、数pxが効く。 */
  .summary-item{padding:1px}
  .summary-val{font-size:var(--fs-sm);line-height:1.15}
  .summary-label{font-size:var(--fs-label);letter-spacing:0;line-height:1.1}
  .filters{padding:var(--s2)}
  .filter-row{gap:var(--s1);margin-bottom:var(--s1)}
  .sort-row{gap:var(--s1);margin-top:var(--s1)}
  .layer-seg{margin-bottom:var(--s2)}
  /* Four segments share the row since the 飲食 layer landed, so they give up
     their side padding before they give up their label. */

  /* ---- Touch targets ---- */
  .colo-item{min-height:40px}
  .filter-group select,.filter-group input,.sort-select,.sf-age-row select{min-height:40px}
  /* 飲食 (D3/UX2): its four dropdowns, the 子連れ toggle and the 昼の予算 basis
     toggle. The generic rules above already reach them; they are named so this
     block visibly covers the layer. */
  #fCatGroup,#fCat,#fMichelin,#fPriceBand,#toggleKidOk,#toggleDayBudget{min-height:40px}

  /* ---- スマホでは絞り込みと並び替えを1本の開閉にまとめる（2026-08-16） ----
     実測: 390×780でパネルは331px、そのうち約296pxがコントロールで埋まり、
     最初のカードは上から731px＝初期画面に店が1軒も映っていなかった。
     タップ標的40pxは下げられない（a11y要件）ので、枠の数を減らすしかない。
     地図の取り分(45%)は2026-08-07に是正済みの値なので触らない。
     `!important` は data-layer-only / data-mode-only をJSがインラインstyleで
     出し入れするため（インラインstyleに勝つ必要がある）。 */
  body:not(.more-open) .filter-row[data-layer-only]{display:none!important}
  body:not(.more-open) .filter-row[data-mode-only]{display:none!important}
  body:not(.more-open) #sortRow{display:none!important}

  /* 点数は自分の行を持たず、カード右上に寄せる（縦に28px返す）。
     数字自体は残す — 既定の並び順が台帳スコア順なので、消すと順番の理由が
     読めなくなる。狭い画面でだけの措置で、パソコンでは従来どおり1行使う。 */
  .record-card{position:relative}
  .record-card .scorebox{position:absolute;top:6px;right:10px;margin:0;padding:0;border:none;gap:0}
  .record-card .card-head{padding-right:52px}
  /* Two chips (michelin + category) now share the row under a dining name. */
  .card-chips .card-chip{max-width:calc(50% - var(--s1))}

  /* ---- 外食モード (D4) ---- */
  /* The header is 44px here and the h1 already fills it, so the mode switch
     drops its emoji-plus-word to the word and keeps a 40px tap target. */
  .mode-seg{margin-left:var(--s2)}
  .mode-btn{min-height:40px;padding:0 var(--s2);font-size:var(--fs-label)}
  #toggleVisited{min-height:40px;padding:6px 2px;font-size:var(--fs-xs)}
  #fVenueType,#toggleWant,#toggleUndone{min-height:40px}
  /* Every control inside a record box, including the three 再訪意向 buttons
     which are the smallest thing on the screen. */
  .vb-toggle,.vb-rv-btn,.vb-amt,.vb-vd,.data-btn{min-height:40px}
  .vb-memo{min-height:72px}
  .vb-rv{gap:2px}
  .card-main{padding:var(--s2) var(--s3)}
  .visitbox{padding:var(--s2)}
  .data-area{font-size:var(--fs-label)}
  /* The bar is the last thing above the footer; it must not eat the list. */
  /* ヘッダー44pxの中で、切り替えボタンと取り合う。名前が長くても省略記号で
     受け、💾ボタンは絵文字だけに縮める（ラベルはJS側で切り替える）。 */
  .savebar{margin-left:var(--s1);gap:var(--s1)}
  /* 44pxのヘッダーで空くのは実測128px。全文206pxは入らないので、後半(いつ保存
     したか)と💾のラベルを落とし、名前だけは必ず残す。落とした情報はデータ管理
     画面と title 属性が持っている。 */
  .sb-tail,.sb-btn-label{display:none}
  .savebar-link{padding:1px 6px}
  .toast{bottom:var(--s4);max-width:90vw}
  .disclosure{min-height:40px;padding:var(--s2) 0}
  .chip-toggle,.sort-btn,.sf-back,.fchip-clear,.btn-clear-all{min-height:40px}
  .search-clear{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;padding:0}
  .chip-name{min-height:40px}
  .chip-vis{width:24px;height:24px}
  .data-details>summary{min-height:40px;display:flex;align-items:center}
  .info-tab{min-height:40px}
  .nb-row,.sf-row,.sf-condo-row{min-height:40px}
  /* A chip's ✕ has to stay small or the pill stops being a pill, so the tap
     area is grown invisibly around the glyph instead of the glyph itself. */
  .fchip-x{position:relative}
  .fchip-x::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px}

  /* ---- Active-filter chips: one scrolling row, never a growing wall ---- */
  .chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .fchip{flex-shrink:0}

  .condo-card{padding:var(--s2) var(--s3)}
  .card-name{font-size:var(--fs-sm)}
  .card-hero{font-size:var(--fs-md)}
  .skel-card{padding:var(--s2) var(--s3)}
  .empty-state{padding:var(--s4) var(--s3)}
  .panel-footer{padding:var(--s1) var(--s2)}
  .map-legend{bottom:var(--s2);left:var(--s2);padding:var(--s2);max-width:70vw}
  .tier-badge{width:12px!important;height:12px!important;line-height:12px!important;font-size:8px!important}

  /* ---- Detail overlay: a sheet over the map, not a full-height column.
     bottom:auto releases the base rule's top/bottom stretch so max-height can
     actually cap it; the header inside stays sticky and the body scrolls. ---- */
  .info-overlay{top:0;bottom:auto;left:var(--s2);right:var(--s2);width:auto;max-width:none;max-height:calc(55% - var(--s2));overflow-y:auto;border-radius:var(--r-card)}
  .info-name{font-size:var(--fs-md)}

  /* ---- 学費くらべ ---- */
  .sf-header{padding:var(--s2)}

  .area-jump{top:6px;left:46px;right:6px;max-width:calc(100% - 52px);padding:var(--s1) 6px;gap:2px}
  /* 40px（タップ標的の方針値）。2026-08-07 の保留は「16個が詰まるので折りたたみと
     セットでないと成立しない」としていたが、実測するとバーは既に横スクロールする
     構造で（中身641px / 枠334px）、40px化のコストは**地図の高さ8pxだけ**だった。
     折りたたみもドロップダウンも要らない。 */
  .area-jump button{font-size:var(--fs-label);padding:var(--s1) var(--s2);min-height:40px}
  .aj-label{font-size:var(--fs-label)}
}
</style>
</head>
<body>
<header class="header">
  <h1>KL・ペナン 住まいマップ<span class="en">KL &amp; Penang Living Map</span></h1>
  <!-- D4: 住まい / 外食 — two apps over the same map. 外食 pins the layer to
       飲食 and reveals the private record UI; 住まい never shows any of it. -->
  <div class="mode-seg" id="modeSeg" role="tablist" aria-label="モードを選ぶ">
    <button type="button" class="mode-btn active" data-mode="home" role="tab" aria-selected="true" onclick="setMode('home')" title="物件・学校・商業・飲食を見くらべる">🏠 住まい</button>
    <button type="button" class="mode-btn" data-mode="eatout" role="tab" aria-selected="false" onclick="setMode('eatout')" title="飲食店の台帳と、自分の訪問記録">🍽 外食</button>
  </div>
  <!-- 保存の状況は 住まい/外食 の切り替えのすぐ右、上段に置く(2026-08-16 竹森氏
       指示)。一覧の下の帯だったときは、記録を付けている最中に視線に入らず、
       一覧を読むたびに最下部まで往復していた。ヘッダーは畳まれないので、
       スマホでも「いま誰として、どこまで保存されているか」が常に見える。 -->
  <div class="savebar" id="saveBar" role="status" aria-live="polite" style="display:none"></div>
</header>
<main class="main" style="position:relative">
  <div id="map" role="application" aria-label="地図。物件・学校・商業施設・飲食店のマーカーを表示します。キーボードでは右の一覧から選んでください。"></div>
  <div class="area-jump" id="areaJump" role="group" aria-label="エリアへ移動">
    <span class="aj-label">🏙️KL</span>
    <button data-area="mont-kiara" onclick="jumpToArea('mont-kiara')" title="モントキアラ">Mont Kiara</button>
    <button data-area="parkcity" onclick="jumpToArea('parkcity')" title="デサ・パークシティ">ParkCity</button>
    <button data-area="klcc" onclick="jumpToArea('klcc')" title="KLCC/Bukit Bintang">KLCC</button>
    <button data-area="bangsar" onclick="jumpToArea('bangsar')" title="バンサー">Bangsar</button>
    <button data-area="damansara" onclick="jumpToArea('damansara')" title="ダマンサラ・ハイツ">Damansara H.</button>
    <button data-area="klgcc" onclick="jumpToArea('klgcc')" title="KLGCC Resort">KLGCC</button>
    <button data-area="ampang" onclick="jumpToArea('ampang')" title="アンパン/U-Thant">Ampang</button>
    <button data-area="all-kl" onclick="jumpToArea('all-kl')" title="KL全体">KL全体</button>
    <span class="aj-div">|</span>
    <!-- ペナンは滅多に使わない（2026-08-07 裁定）ので既定で畳む。押すと
         エリアが開き、もう一度押すと閉じる。開閉のみでジャンプはしない。 -->
    <button type="button" id="penangToggle" class="aj-penang-toggle" aria-expanded="false" aria-controls="penangAreas" onclick="togglePenangAreas()" title="ペナンのエリアを開く">🏝️ Penang ▸</button>
    <span id="penangAreas" class="penang-areas" role="group" aria-label="ペナンのエリア">
      <button data-area="gurney" onclick="jumpToArea('gurney')" title="ガーニー/プラウ・ティクス">Gurney</button>
      <button data-area="tanjung" onclick="jumpToArea('tanjung')" title="タンジュン・トコン/ブンガ">Tanjung</button>

  </div>
  <!-- aria-modal="false": the overlay sits over the map but never traps you —
       the list, the filters and the map stay operable behind it. Its
       aria-label is rewritten with the selected record's name by info.js. -->
  <div class="info-overlay" id="infoOverlay" role="dialog" aria-modal="false" aria-label="詳細" tabindex="-1"><div id="infoContent"></div></div>
  <button class="toggle-panel" id="toggleBtn" aria-label="一覧パネルを閉じる" aria-expanded="true" aria-controls="panel" onclick="togglePanel()">&#9664;</button>
  <aside class="panel" id="panel" aria-label="検索と一覧">
    <!-- Each figure is tied to its caption with aria-labelledby: on its own,
         「271」 tells a screen-reader user nothing. Shown is a live region so a
         filter change announces the new count instead of changing in silence. -->
    <div class="summary-bar" id="summaryBar">
      <div class="summary-item"><div class="summary-val" id="sumTotal" aria-labelledby="sumTotalLabel">–</div><div class="summary-label" id="sumTotalLabel">画面内</div></div>
      <div class="summary-item"><div class="summary-val" id="sumFiltered" aria-labelledby="sumFilteredLabel" aria-live="polite" aria-atomic="true">–</div><div class="summary-label" id="sumFilteredLabel">表示中</div></div>
      <div class="summary-item"><div class="summary-val" id="sumStat3" aria-labelledby="sumStat3Label">–</div><div class="summary-label" id="sumStat3Label">PSF中央値</div></div>
      <div class="summary-item"><div class="summary-val" id="sumStat4" aria-labelledby="sumStat4Label">–</div><div class="summary-label" id="sumStat4Label">家賃中央値</div></div>
    </div>
    <div class="filters">
      <!-- 飲食は住まいモードの「層」ではない（2026-08-07 裁定: 住まいモードは
           物件/学校/商業 の3層、飲食店は外食モード専用）。4つ目のボタンは層では
           なく外食モードへの入口で、押すと setLayer('dining') が setMode('eatout')
           に読み替えられてモードごと移る（src/ui/list.js）。↗ と title は「ここから
           出ていく」ことを見た目で言うためのもの。UX2 以前はこの入口が無く、飲食に
           行く道はヘッダーの小さなモード切替だけだった。 -->
      <!-- 層はチェックボックス（2026-08-07 裁定: 1つ・2つ・全部と複数を同時に
           地図表示できる）。各チップ = ☑（地図に出す/消す）＋名前（一覧をその層に
           切り替える。アクティブ層は常に表示に含まれる）。 -->
      <div class="layer-seg" id="layerSeg" role="group" aria-label="表示する種別">
        <div class="layer-chip active" data-layer="condo">
          <button type="button" class="chip-vis" aria-pressed="true" aria-label="物件を地図に表示" onclick="toggleLayerVisible('condo')">✓</button>
          <button type="button" class="chip-name" aria-current="true" onclick="setLayer('condo')">🏠 物件</button>
        </div>
        <div class="layer-chip" data-layer="school">
          <button type="button" class="chip-vis" aria-pressed="false" aria-label="学校を地図に表示" onclick="toggleLayerVisible('school')">✓</button>
          <button type="button" class="chip-name" aria-current="false" onclick="setLayer('school')">🎓 学校</button>
        </div>
        <div class="layer-chip" data-layer="commercial">
          <button type="button" class="chip-vis" aria-pressed="false" aria-label="商業施設を地図に表示" onclick="toggleLayerVisible('commercial')">✓</button>
          <button type="button" class="chip-name" aria-current="false" onclick="setLayer('commercial')">🛒 商業</button>
        </div>
        <div class="layer-chip" data-layer="dining">
          <button type="button" class="chip-vis" aria-pressed="false" aria-label="飲食店を地図に表示" onclick="toggleLayerVisible('dining')">✓</button>
          <button type="button" class="chip-name" aria-current="false" onclick="setLayer('dining')" title="外食モードを開く">🍽 飲食 ↗</button>
        </div>
      </div>

      <div class="filter-row" id="searchRow">
        <div class="filter-group" style="flex:1">
          <label for="fSearch" class="vh">検索 / Search</label>
          <div class="search-wrap">
            <input type="text" id="fSearch" placeholder="名前・住所で検索" oninput="applyFiltersDebounced()">
            <button type="button" class="search-clear" aria-label="検索をクリア" onclick="clearSearch()">✕</button>
          </div>
        </div>
      </div>

      <div class="filter-row" data-layer-only="condo">
        <div class="filter-group"><label for="fRent">家賃帯 (RM/月)</label><select id="fRent" onchange="applyFilters()"><option value="">すべて</option><option value="0-3000">RM3,000以下</option><option value="0-5000">RM5,000以下</option><option value="0-8000">RM8,000以下</option><option value="0-12000">RM12,000以下</option><option value="0-20000">RM20,000以下</option></select></div>
        <div class="filter-group"><label for="fTier">Tier</label><select id="fTier" onchange="applyFilters()"><option value="">すべて</option><option value="S+">S+ (Ultra Luxury)</option><option value="A+">A+ (Super Luxury &amp; above)</option><option value="B+">B+ (Luxury &amp; above)</option><option value="C+">C+ (Upper Mid &amp; above)</option><option value="S">S only</option><option value="A">A only</option><option value="B">B only</option><option value="C">C only</option><option value="D">D only</option></select></div>
      </div>
      <div class="filter-row" data-layer-only="school" style="display:none">
        <div class="filter-group"><label for="fSchoolAge">対象年齢</label><select id="fSchoolAge" onchange="applyFilters()"><option value="">すべて</option><option value="3">3歳</option><option value="4">4歳</option><option value="5">5歳</option><option value="6">6歳</option><option value="7">7歳</option><option value="8">8歳</option><option value="9">9歳</option><option value="10">10歳</option><option value="11">11歳</option><option value="12">12歳</option><option value="13">13歳</option><option value="14">14歳</option><option value="15">15歳</option><option value="16">16歳</option><option value="17">17歳</option><option value="18">18歳</option></select></div>
        <div class="filter-group"><label for="fCurriculum">カリキュラム</label><select id="fCurriculum" onchange="applyFilters()"><!-- options are filled from CURRICULA in src/domain/filter.js --><option value="">すべて</option></select></div>
      </div>
      <div class="filter-row" data-layer-only="commercial" style="display:none">
        <div class="filter-group"><label for="fNla">規模 (NLA)</label><select id="fNla" onchange="applyFilters()"><option value="">すべて</option><option value="1-150000">&lt;150K sf</option><option value="150000-500000">150K-500K sf</option><option value="500000-99999999">&gt;500K sf</option></select></div>
      </div>
      <!-- 飲食: カテゴリ options come from CAT_GROUPS and ミシュラン from
           MICHELIN_FILTERS (src/domain/filter.js), so a dropdown can never
           offer a value the filter does not understand.

           2026-08-16 竹森氏裁定: 常時見せる4枠は「実際に絞れる順」に選び直した。
           実測(357店)では 予算(〜RM50=128件)・ミシュラン(75件)はよく絞れる一方、
           評価は★4.3で321/357件(90%)が残り、車での所要時間は全店が44分以内で
           〜45分が1件も絞らなかった。効かない2つは廃止。ミシュランは残す。

           同日の追加裁定: エリアの絞り込みも削除した。地図の上にエリアへ飛ぶバーが
           既にあり、そちらで用が足りるため。空いた枠に細分類を入れ、カテゴリの
           すぐ右に置いた(選んだ大分類の中をもう一段絞る、という関係が並びで分かる)。
           枠の数は4のままなので、スマホの高さは変わらない。細分類は大分類を
           選ぶまで中身が決まらないので、それまでは押せない状態で待つ。 -->
      <div class="filter-row filter-row-2col" data-layer-only="dining" style="display:none">
        <div class="filter-group"><label for="fCatGroup">カテゴリ</label><select id="fCatGroup" onchange="onCatGroupChange()"><option value="">すべて</option></select></div>
        <div class="filter-group" id="fCatWrap"><label for="fCat">細分類</label><select id="fCat" onchange="applyFilters()" disabled><option value="">—</option></select></div>
        <div class="filter-group"><label id="fPriceBandLabel" for="fPriceBand">予算 (1人・夜)</label><select id="fPriceBand" onchange="applyFilters()"><option value="">すべて</option><option value="0-50">〜RM50</option><option value="50-150">RM50-150</option><option value="150-400">RM150-400</option><option value="400-">RM400〜</option></select></div>
        <div class="filter-group"><label for="fMichelin">ミシュラン</label><select id="fMichelin" onchange="applyFilters()"><option value="">すべて</option></select></div>
      </div>
      <!-- 自分の記録は「良い店ばかりの357軒」を自分ごとの数十軒に変える唯一の軸なので、
           折りたたみの外に置く(2026-08-16)。3つは独立トグルで、「行きたい」×「未訪問」を
           併用すると「行きたいのにまだ行っていない店」になる。 -->
      <div class="filter-row" data-mode-only="eatout" style="display:none">
        <div class="filter-group"><span class="fg-label">自分の記録</span>
          <div class="fg-btns">
            <button type="button" class="chip-toggle" id="toggleVisited" aria-pressed="false" onclick="toggleVisitedFilter()" title="訪問記録を付けた店だけに絞る">✓ 行った店</button>
            <button type="button" class="chip-toggle" id="toggleWant" aria-pressed="false" onclick="toggleWantFilter()" title="「行きたい」に入れた店だけに絞る">♡ 行きたい</button>
            <button type="button" class="chip-toggle" id="toggleUndone" aria-pressed="false" onclick="toggleUndoneFilter()" title="まだ訪問記録がない店だけに絞る">未訪問</button>
          </div>
        </div>
        </div>


      <button type="button" class="disclosure" id="moreToggle" onclick="toggleMore()" aria-controls="moreFilters" aria-expanded="false">絞り込み ⌄</button>

      <div id="moreFilters" style="display:none">
        <div class="filter-row" data-layer-only="condo">
          <div class="filter-group"><label for="fSalePsf">Sale PSF</label><select id="fSalePsf" onchange="applyFilters()"><option value="">すべて</option><option value="0-500">&lt;500</option><option value="500-700">500-700</option><option value="700-900">700-900</option><option value="900-1100">900-1.1K</option><option value="1100-9999">&gt;1.1K</option></select></div>
          <div class="filter-group"><label for="fYear">竣工年</label><select id="fYear" onchange="applyFilters()"><option value="">すべて</option><option value="1990-2000">&lt;2000</option><option value="2000-2010">2000s</option><option value="2010-2020">2010s</option><option value="2020-2030">2020+</option></select></div>
        </div>
        <div class="filter-row" data-layer-only="condo">
          <div class="filter-group"><label for="fSize">広さ (sqft)</label><select id="fSize" onchange="applyFilters()"><option value="">すべて</option><option value="0-800">&lt;800</option><option value="800-1500">800-1.5K</option><option value="1500-2500">1.5-2.5K</option><option value="2500-99999">&gt;2.5K</option></select></div>
          <div class="filter-group"><label for="fAge">築年数</label><select id="fAge" onchange="applyFilters()"><option value="">すべて</option><option value="0-5">0-5年</option><option value="0-10">0-10年</option><option value="0-15">0-15年</option><option value="0-20">0-20年</option><option value="10-20">10-20年</option><option value="20-99">20年超</option></select></div>
        </div>
        <div class="filter-row" data-layer-only="condo">
          <div class="filter-group"><label for="fStatus">状態</label><select id="fStatus" onchange="applyFilters()"><option value="">すべて</option><option value="completed">Completed (既築)</option><option value="upcoming">Upcoming (今後建つ)</option></select></div>
          <div class="filter-group"><span class="fg-label">受賞</span><button type="button" class="chip-toggle" id="toggleAward" aria-pressed="false" onclick="toggleAward()" title="FIABCI Malaysia Property Award 受賞物件のみ">🏆 受賞のみ</button></div>
        </div>
        <div class="filter-row" data-layer-only="school" style="display:none">
          <div class="filter-group"><label for="fFee">年間学費</label><select id="fFee" onchange="applyFilters()"><option value="">すべて</option><option value="0-40000">RM4万以下/年</option><option value="0-80000">RM8万以下/年</option><option value="0-120000">RM12万以下/年</option></select></div>
        </div>
        <div class="filter-row" data-layer-only="commercial" style="display:none">
          <div class="filter-group"><label for="fOpenYear">開業年</label><select id="fOpenYear" onchange="applyFilters()"><option value="">すべて</option><option value="0-2000">〜2000</option><option value="2001-2010">2001-2010</option><option value="2011-2020">2011-2020</option><option value="2021-2100">2021〜</option></select></div>
          <div class="filter-group"><label for="fAnchor">アンカー検索</label><input type="text" id="fAnchor" placeholder="例: Village Grocer" oninput="applyFilters()"></div>
        </div>
        <!-- 飲食: the price band is judged on the TOP of one service's range —
             夜 by default, 昼 while the toggle beside it is on — see
             diningPriceCeiling() in src/domain/filter.js.
             昼夜を「2つの絞り込み」に割るのは却下（並び替えは1つの順番しか持てず、
             フィルタと食い違う）。基準を1つ切り替える形なので、価格帯・並び替え・
             予算中央値は必ず同じ数字を読む。ラベルの「夜基準/昼基準」はJSが書き換える。 -->
        <!-- 施設タイプ options are built from VENUE_TYPES。エリアと価格帯は
             2026-08-16に上段へ移した（実際によく絞れるため）。 -->
        <div class="filter-row" data-layer-only="dining" style="display:none">
          <div class="filter-group"><label for="fVenueType">施設タイプ</label><select id="fVenueType" onchange="applyFilters()"><option value="">すべて</option></select></div>
          <div class="filter-group"><span class="fg-label">予算の基準</span><button type="button" class="chip-toggle" id="toggleDayBudget" aria-pressed="false" onclick="toggleDayBudget()" title="予算・並び替え・予算中央値を、夜ではなく昼の上限で見る">☀ 昼の予算</button></div>
        </div>
        <div class="filter-row" data-layer-only="dining" style="display:none">
          <div class="filter-group"><span class="fg-label">子連れ</span>
            <div class="fg-btns">
              <button type="button" class="chip-toggle" id="toggleKidOk" aria-pressed="false" onclick="toggleKidOk()" title="子ども連れで行きやすい店だけに絞る">👶 子連れ◎のみ</button>
            </div>
          </div>
        </div>
        <!-- Every layer except 飲食, which filters on its own curated areas. -->
        <div class="filter-row" data-layer-only="condo,school,commercial">
          <div class="filter-group"><label for="fArea">エリア</label><select id="fArea" onchange="applyFilters()"><option value="">すべて</option><option value="mont-kiara">Mont Kiara</option><option value="desa-parkcity">Desa ParkCity</option><option value="bangsar">Bangsar</option><option value="klgcc">KLGCC Resort</option><option value="klcc">KLCC</option><option value="ampang">Ampang/U-Thant</option><option value="damansara">Damansara Heights</option><option value="other-kl">その他KL</option><option value="gurney">Gurney / Pulau Tikus (Penang)</option><option value="tanjung">Tanjung Tokong / Bungah (Penang)</option><option value="ferringhi">Batu Ferringhi (Penang)</option><option value="bayan">Bayan Lepas (Penang)</option><option value="george-town">George Town (Penang)</option><option value="gelugor">Gelugor / Jelutong (Penang)</option></select></div>
        </div>
      </div>

      <div class="chips" id="filterChips" style="display:none"></div>

      <div class="sort-row" id="sortRow">
        <label class="sort-label" for="fSort">並び替え</label>
        <select id="fSort" class="sort-select" onchange="setSort(this)"></select>
